function log(msg, tipo){
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += '<div class="'+(tipo||'')+'">' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}

async function importar(){
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Importando...';
  log('Iniciando importação...');
  try {
    var meses = Object.keys(DADOS);
    for(var i=0; i<meses.length; i++){
      var id = meses[i];
      await db.collection('linkplas_meses').doc(id).set(DADOS[id]);
      var n = Object.keys(DADOS[id].injetoras).length;
      log('✓ ' + id + ' — ' + n + ' injetoras importadas', 'ok');
    }
    log('✅ Importação concluída! Pode fechar esta aba e abrir o dashboard.', 'ok');
    btn.textContent = 'Concluído!';
  } catch(e){
    log('❌ Erro: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Tentar novamente';
  }
}
