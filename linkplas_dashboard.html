<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Link Plas — BLF</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#222;}
/* HEADER */
.hdr{background:#0A1128;color:#fff;padding:0 28px;display:flex;align-items:center;gap:16px;height:58px;position:sticky;top:0;z-index:200;}
.hdr-logo{display:flex;align-items:center;gap:10px;}
.hdr-logo img{width:30px;height:auto;}
.hdr-brand{font-size:15px;font-weight:700;}
.hdr-brand span{color:#F5C518;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.btn-edit{background:none;border:2px solid rgba(255,255,255,0.3);color:#fff;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-edit:hover{border-color:#F5C518;color:#F5C518;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#34A853;}
.sync-dot.off{background:#EA4335;}
/* EDIT BAR */
.edit-bar{background:#FBBC04;color:#1a1a00;text-align:center;padding:6px;font-size:13px;font-weight:700;display:none;}
/* TABS */
.tabs-wrap{background:#fff;border-bottom:2px solid #eee;padding:0 28px;display:flex;align-items:center;gap:0;overflow-x:auto;}
.tab{padding:14px 18px;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;}
.tab:hover{color:#0A1128;}
.tab.active{color:#0A1128;border-bottom-color:#0A1128;}
.tab.mes-tab{color:#555;}
.tab-add{padding:12px 14px;color:#aaa;cursor:pointer;font-size:18px;flex-shrink:0;}
.tab-add:hover{color:#0A1128;}
.tab-del{display:none;margin-left:6px;color:#aaa;font-size:11px;line-height:1;padding:1px 3px;border-radius:3px;}
.tab-del:hover{color:#c00;background:#fee;}
.edit-mode .tab-del{display:inline;}
/* PANELS */
.panel{display:none;padding:28px;max-width:1200px;margin:0 auto;}
.panel.active{display:block;}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.stat-card .s-val{font-size:36px;font-weight:900;color:#0A1128;}
.stat-card .s-val.verde{color:#34A853;}
.stat-card .s-val.vermelho{color:#EA4335;}
.stat-card .s-val.amarelo{color:#b8860b;}
.stat-card .s-label{font-size:12px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.stat-card .s-sub{font-size:11px;color:#bbb;margin-top:4px;}
.chart-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.07);margin-bottom:20px;}
.chart-card h3{font-size:14px;font-weight:700;color:#0A1128;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px;}
.chart-wrap{position:relative;height:240px;}
.frase-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,0.07);margin-bottom:24px;border-left:4px solid #F5C518;}
.frase-label{font-size:10px;font-weight:700;color:#b8860b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.frase-txt{font-size:14px;color:#444;line-height:1.7;font-style:italic;width:100%;border:none;background:none;font-family:inherit;resize:none;outline:none;}
.frase-txt:not([readonly]):focus{background:#fffdf0;border-radius:6px;padding:6px;}
.hist-section h2{font-size:17px;font-weight:800;color:#0A1128;margin-bottom:16px;}
.hist-cards{display:flex;flex-direction:column;gap:12px;}
.hist-card{background:#fff;border-radius:10px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,0.06);display:flex;align-items:center;gap:20px;}
.hist-mes{font-size:14px;font-weight:700;color:#0A1128;min-width:130px;}
.hist-bar-wrap{flex:1;height:14px;background:#f0f0f0;border-radius:7px;overflow:hidden;}
.hist-bar{height:100%;background:#0A1128;border-radius:7px;transition:width 0.4s;}
.hist-pct{font-size:13px;font-weight:700;color:#0A1128;min-width:40px;text-align:right;}
.hist-badges{display:flex;gap:8px;}
.hbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;}
.hbadge.vaz{background:#fee;color:#c00;}
.hbadge.rep{background:#e8f0fe;color:#1967d2;}
/* MÊS */
.mes-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.mes-header h2{font-size:20px;font-weight:800;color:#0A1128;}
.mes-stats-mini{display:flex;gap:12px;flex-wrap:wrap;}
.mini-stat{background:#fff;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.mini-stat span{color:#0A1128;}
.galp-section{margin-bottom:32px;}
.galp-title{font-size:13px;font-weight:700;color:#0A1128;text-transform:uppercase;letter-spacing:1px;background:#f5f6fa;padding:10px 16px;border-radius:8px 8px 0 0;border-left:4px solid #0A1128;}
.inj-table{width:100%;border-collapse:collapse;background:#fff;border-radius:0 0 8px 8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.inj-table th{background:#0A1128;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:10px 12px;text-align:left;}
.inj-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f5f5f5;vertical-align:middle;}
.inj-table tr:last-child td{border-bottom:none;}
.inj-table tr:hover td{background:#fafbfc;}
.inj-id{font-weight:700;color:#0A1128;font-size:12px;}
.inj-modelo{color:#555;font-size:12px;}
.chk-cell{text-align:center;}
.chk-inj{width:18px;height:18px;cursor:pointer;accent-color:#0A1128;}
.txt-field{width:100%;border:1.5px solid #e8e8e8;border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;}
.txt-field:focus{outline:none;border-color:#0A1128;}
.txt-field[readonly]{background:none;border-color:transparent;}
.vaz-chk{accent-color:#EA4335;}
/* OBSERVAÇÕES */
.obs-section{margin-top:28px;}
.obs-section h3{font-size:14px;font-weight:700;color:#0A1128;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.5px;}
.obs-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.obs-item{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);display:flex;gap:12px;align-items:flex-start;}
.obs-data{font-size:11px;font-weight:700;color:#0A1128;min-width:80px;}
.obs-texto{flex:1;font-size:13px;color:#444;line-height:1.6;border:none;background:none;font-family:inherit;resize:vertical;min-height:36px;outline:none;width:100%;}
.obs-texto[readonly]{resize:none;}
.obs-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0 4px;}
.obs-del:hover{color:#c00;}
.btn-add-obs{background:none;border:2px dashed #ddd;color:#888;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px;font-family:inherit;}
.btn-add-obs:hover{border-color:#0A1128;color:#0A1128;}
/* RELATÓRIOS */
.rel-list{display:flex;flex-direction:column;gap:12px;}
.rel-card{background:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 1px 4px rgba(0,0,0,0.07);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.rel-mes{font-size:16px;font-weight:700;color:#0A1128;}
.rel-stats{display:flex;gap:12px;font-size:13px;color:#666;}
.rel-stat{display:flex;align-items:center;gap:4px;}
.btn-pdf{background:#0A1128;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-pdf:hover{background:#1a2a4a;}
/* PRINT */
#print-area{display:none;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  #app{display:none!important;}
  #print-area{display:block!important;}
  html,body{margin:0;padding:0;background:#fff;}
  body > div[style*="position"],body > div[style*="fixed"],[data-netlify],#netlify-identity-widget{display:none!important;}
  .p-page{page-break-after:always;width:210mm;font-family:'Segoe UI',Arial,sans-serif;}
  .p-page:last-child{page-break-after:avoid;}
  @page{margin:0;size:A4 portrait;}
}
.p-page{width:210mm;background:#fff;font-family:'Segoe UI',Arial,sans-serif;}
.p-hdr{background:#0A1128;padding:18px 36px;display:flex;align-items:center;justify-content:space-between;}
.p-hdr-left{display:flex;align-items:center;gap:12px;}
.p-hdr-logo{width:38px;height:auto;}
.p-hdr-title{color:#fff;}
.p-hdr-title .t1{font-size:8px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:2px;}
.p-hdr-title .t2{font-size:17px;font-weight:900;color:#fff;}
.p-hdr-right{text-align:right;}
.p-hdr-right .r1{font-size:9px;color:rgba(255,255,255,0.4);}
.p-hdr-right .r2{font-size:13px;font-weight:700;color:#F5C518;margin-top:2px;}
.p-body{padding:20px 36px;}
.p-sumario{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.p-stat{border:1.5px solid #eee;border-radius:6px;padding:10px 12px;}
.p-stat .pv{font-size:22px;font-weight:900;color:#0A1128;}
.p-stat .pl{font-size:8px;color:#888;text-transform:uppercase;letter-spacing:0.5px;}
.p-frase{font-size:10.5px;font-style:italic;color:#666;padding:10px 14px;border-left:3px solid #F5C518;margin-bottom:16px;line-height:1.6;}
.p-galp-title{font-size:9px;font-weight:700;color:#fff;background:#0A1128;padding:6px 10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:0;}
.p-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:14px;}
.p-table th{background:#f5f6fa;color:#0A1128;font-size:8px;text-transform:uppercase;letter-spacing:0.5px;padding:5px 8px;text-align:left;border-bottom:1.5px solid #ddd;}
.p-table td{padding:5px 8px;border-bottom:1px solid #f0f0f0;color:#333;}
.p-table tr:last-child td{border-bottom:none;}
.p-obs-section{margin-top:14px;}
.p-obs-title{font-size:9px;font-weight:700;color:#0A1128;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.p-obs-item{padding:6px 10px;border-left:2px solid #F5C518;margin-bottom:6px;}
.p-obs-data{font-size:8px;font-weight:700;color:#0A1128;}
.p-obs-txt{font-size:10px;color:#444;line-height:1.5;}
.p-footer{background:#0A1128;padding:10px 36px;display:flex;justify-content:space-between;align-items:center;}
.p-footer-txt{font-size:8px;color:rgba(255,255,255,0.5);}
.p-footer-logo{width:24px;height:auto;}
.chk-icon{font-size:12px;}
</style>
</head>

var mesesCache = {};

// ===== FIREBASE LISTENER =====
db.collection('linkplas_meses').onSnapshot(function(snap){
  mesesCache = {};
  snap.docs.forEach(function(d){mesesCache[d.id] = d.data();});
  garantirMesAtual();
  renderTabs();
  renderAbaAtiva();
  document.getElementById('sync-dot').className = 'sync-dot';
}, function(){
  document.getElementById('sync-dot').className = 'sync-dot off';
});

function mesAtualId(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function garantirMesAtual(){
  var id = mesAtualId();
  if (!mesesCache[id]){
    db.collection('linkplas_meses').doc(id).set({mes:id, injetoras:{}, obs:[], frase:'', criadoEm: new Date().toLocaleDateString('pt-BR')});
  }
}

function mesLabel(id){
  var meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var p = id.split('-');
  return meses[parseInt(p[1])-1] + ' ' + p[0];
}

// ===== TABS =====
function renderTabs(){
  var wrap = document.getElementById('tabs-wrap');
  // Collect existing mes tabs, remove them
  var existingMesTabs = wrap.querySelectorAll('.mes-tab');
  existingMesTabs.forEach(function(t){t.remove();});
  // Insert before the "+" button
  var addBtn = wrap.querySelector('.tab-add');
  var ids = Object.keys(mesesCache).sort().reverse();
  ids.forEach(function(id){
    if (document.getElementById('tab-mes-'+id)) return;
    var t = document.createElement('div');
    t.className = 'tab mes-tab';
    t.id = 'tab-mes-'+id;
    t.innerHTML = mesLabel(id) + '<span class="tab-del" title="Excluir mês" onclick="event.stopPropagation();deletarMes(\''+id+'\')">✕</span>';
    t.onclick = (function(mid){ return function(e){ if(e.target.classList.contains('tab-del')) return; abrirAba('mes-'+mid, t); }; })(id);
    wrap.insertBefore(t, addBtn);
  });
  // Mark active
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  var activeTab = document.getElementById('tab-'+abaAtiva) || document.getElementById('tab-mes-'+abaAtiva.replace('mes-',''));
  if (activeTab) activeTab.classList.add('active');
}

function abrirAba(aba, tabEl){
  abaAtiva = aba;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  if (tabEl) tabEl.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  if (aba === 'dashboard') document.getElementById('panel-dashboard').classList.add('active');
  else if (aba === 'relatorios') document.getElementById('panel-relatorios').classList.add('active');
  else criarOuMostrarPanelMes(aba.replace('mes-',''));
  renderAbaAtiva();
}

function criarOuMostrarPanelMes(mesId){
  var pid = 'panel-mes-'+mesId;
  if (!document.getElementById(pid)){
    var p = document.createElement('div');
    p.className = 'panel';
    p.id = pid;
    document.getElementById('app').appendChild(p);
  }
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById(pid).classList.add('active');
}

function deletarMes(mesId){
  if(!isEditMode) return;
  if(!confirm('Excluir o mês "'+mesLabel(mesId)+'" e todos os seus dados? Essa ação não pode ser desfeita.')) return;
  db.collection('linkplas_meses').doc(mesId).delete().then(function(){
    var panel = document.getElementById('panel-mes-'+mesId);
    if(panel) panel.remove();
    var tab = document.getElementById('tab-mes-'+mesId);
    if(tab) tab.remove();
    if(abaAtiva === 'mes-'+mesId){ abaAtiva='dashboard'; abrirAba('dashboard', document.getElementById('tab-dashboard')); }
  });
}

function adicionarMes(){
  if (!isEditMode) { alert('Entre no modo edição para adicionar meses.'); return; }
  var input = prompt('Digite o mês no formato AAAA-MM (ex: 2025-08):');
  if (!input || !/^\d{4}-\d{2}$/.test(input)) { if(input) alert('Formato inválido.'); return; }
  if (mesesCache[input]) { alert('Este mês já existe.'); return; }
  db.collection('linkplas_meses').doc(input).set({mes:input, injetoras:{}, obs:[], frase:'', criadoEm: new Date().toLocaleDateString('pt-BR')});
}

// ===== MÉTRICAS =====
function calcMetrics(mesId){
  var data = mesesCache[mesId] || {};
  var injs = data.injetoras || {};
  var lubs=0, repos=0, vazs=0;
  Object.values(injs).forEach(function(i){
    if(i.lubrificada) lubs++;
    if(i.reposicao) repos++;
    if(i.vazamento) vazs++;
  });
  return {total:TOTAL_INJ, lubs:lubs, naoLubs:TOTAL_INJ-lubs, repos:repos, vazs:vazs, pct:Math.round(lubs/TOTAL_INJ*100)};
}

function gerarFrase(m){
  var p=m.pct, v=m.vazs, r=m.repos, nl=m.naoLubs;
  if(p===100&&v===0) return 'Desempenho perfeito neste período: todas as '+m.total+' injetoras foram lubrificadas e nenhum vazamento foi registrado.'+(r>0?' '+r+' reposição(ões) de óleo realizada(s).':'');
  if(p>=95&&v===0) return 'Excelente desempenho: '+m.lubs+' de '+m.total+' injetoras lubrificadas ('+p+'%), sem ocorrências de vazamento.'+(r>0?' '+r+' reposição(ões) de óleo realizada(s).':'');
  if(p>=90&&v>0) return 'Bom desempenho: '+p+'% das injetoras lubrificadas. Atenção para '+v+' vazamento(s) identificado(s) e encaminhado(s) para tratamento.'+(r>0?' '+r+' reposição(ões) realizada(s).':'');
  if(p>=75) return 'Desempenho satisfatório: '+m.lubs+' injetoras lubrificadas ('+p+'%). '+nl+' injetora(s) pendente(s) de lubrificação.'+(v>0?' '+v+' vazamento(s) registrado(s).':'')+(r>0?' '+r+' reposição(ões) de óleo.':'');
  if(p>0) return 'Atenção: apenas '+p+'% das injetoras foram lubrificadas neste período. '+nl+' injetora(s) sem registro de lubrificação.'+(v>0?' '+v+' vazamento(s) identificado(s).':'')+' Verificar disponibilidade e planejar reforço.';
  return 'Período sem registros de lubrificação. Preencha os dados das injetoras para gerar a análise de desempenho.';
}

// ===== FIREBASE OPERAÇÕES =====
function salvarCampo(mesId, injId, campo, valor){
  if(!isEditMode) return;
  var upd = {};
  upd['injetoras.'+injId+'.'+campo] = valor;
  db.collection('linkplas_meses').doc(mesId).update(upd).catch(function(){
    db.collection('linkplas_meses').doc(mesId).set({injetoras:{}},{merge:true}).then(function(){
      db.collection('linkplas_meses').doc(mesId).update(upd);
    });
  });
}

function adicionarObs(mesId){
  var data = mesesCache[mesId] || {};
  var obs = (data.obs || []).slice();
  var hoje = new Date().toLocaleDateString('pt-BR');
  obs.push({data:hoje, texto:''});
  db.collection('linkplas_meses').doc(mesId).update({obs:obs});
}

function salvarObs(mesId, idx, valor){
  if(!isEditMode) return;
  var data = mesesCache[mesId] || {};
  var obs = (data.obs || []).slice();
  if(obs[idx]) obs[idx].texto = valor;
  db.collection('linkplas_meses').doc(mesId).update({obs:obs});
}

function deletarObs(mesId, idx){
  if(!confirm('Remover esta observação?')) return;
  var data = mesesCache[mesId] || {};
  var obs = (data.obs || []).slice();
  obs.splice(idx, 1);
  db.collection('linkplas_meses').doc(mesId).update({obs:obs});
}

    obs.forEach(function(o){
      if(!o.texto) return;
      html += '<div class="p-obs-item"><div class="p-obs-data">'+o.data+'</div><div class="p-obs-txt">'+o.texto+'</div></div>';
    });
    html += '</div>';
  }

  html += '</div>'; // p-body
  html += '<div class="p-footer"><div class="p-footer-txt">BLF Bilibio Lubrificação e Filtragem · CNPJ 07.373.726/0001-19 · Serviço terceirizado Link Plas</div><img class="p-footer-logo" src="'+logoSrc+'"/></div>';
  html += '</div>'; // p-page

  document.getElementById('print-area').innerHTML = html;
  window.print();
}

// ===== EDIT MODE =====
function toggleEdit(){
  if(isEditMode){
    isEditMode = false;
  } else {
    var s = prompt('Senha de edição:');
    if(s === SENHA){ isEditMode = true; }
    else if(s !== null){ alert('Senha incorreta.'); return; }
    else return;
  }
  document.getElementById('btn-edit').textContent = isEditMode ? '🔒 Sair da edição' : '✏️ Editar';
  document.getElementById('edit-bar').style.display = isEditMode ? 'block' : 'none';
  document.getElementById('app').className = isEditMode ? 'edit-mode' : '';
  renderTabs();
  renderAbaAtiva();
}

function renderAbaAtiva(){
  if(abaAtiva === 'dashboard') renderDashboard();
  else if(abaAtiva === 'relatorios') renderRelatorios();
  else renderMes(abaAtiva.replace('mes-',''));
}
</script>
